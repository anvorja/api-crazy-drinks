name: Imagen de la versión

# Publishing a version = pushing a tag vX.Y.Z on main's release merge commit.
# The image is NOT rebuilt: the one CI built, tested and pushed to Docker Hub for that commit
# (<sha>, also `latest`) gets the version tags, so `X.Y.Z` and `latest` are the same digest.
# Deploying is not done here: it already happened on the push to main (ci-cd.yml).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (e.g. v4.0.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release-image
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar versión y latest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/api-drinks
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validar tag y versión
        id: version
        run: |
          [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::Tag $TAG is not vX.Y.Z"; exit 1; }
          version="${TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          [[ "$version" == "$package_version" ]] || {
            echo "::error::Tag $TAG does not match package.json version $package_version"; exit 1; }
          commit="$(git rev-list -n 1 "$TAG")"
          git merge-base --is-ancestor "$commit" origin/main || {
            echo "::error::$TAG is not on main: versions are published from main"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          echo "source=$IMAGE:$(git rev-parse --short=7 "$commit")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Etiquetar la imagen ya probada (sin reconstruir)
        env:
          SOURCE: ${{ steps.version.outputs.source }}
        run: |
          docker buildx imagetools inspect "$SOURCE" > /dev/null || {
            echo "::error::$SOURCE does not exist: wait for the CI of that commit on main to finish"; exit 1; }
          docker buildx imagetools create \
            --tag "$IMAGE:${{ steps.version.outputs.version }}" \
            --tag "$IMAGE:${{ steps.version.outputs.minor }}" \
            --tag "$IMAGE:${{ steps.version.outputs.major }}" \
            "$SOURCE"
          for t in "${{ steps.version.outputs.version }}" latest; do
            echo "$t → $(docker buildx imagetools inspect "$IMAGE:$t" --format '{{json .Manifest.Digest}}')"
          done
