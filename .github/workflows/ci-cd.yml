name: CI/CD

# CI on every PR to main/develop. The rulesets require the three job names below as status checks.
# CD on push to main (a release): the image CI built and tested goes to Docker Hub as `latest` and
# `<sha>`, and Render deploys that exact image. Secrets: DOCKER_USERNAME, DOCKER_TOKEN,
# RENDER_API_KEY, RENDER_SERVICE_ID.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    # The job name is the status check the rulesets require: keep them in sync.
    name: Calidad y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Formato (prettier)
        run: pnpm format:check
      - name: Análisis de tipos (tsc)
        run: pnpm typecheck
      - name: Lint (oxlint)
        run: pnpm lint
      - name: Pruebas unitarias
        run: pnpm test
      - name: Build
        run: pnpm build
      - uses: ./.github/actions/ci-env
      - name: Contrato OpenAPI y cliente tipado al día
        # Regenerates openapi/openapi.json and openapi/api.d.ts: if they differ from the
        # committed ones, the API contract changed without regenerating them.
        run: pnpm openapi:check

  tests:
    name: Pruebas e2e e integración
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Pruebas e2e (fakes en memoria, incluye verificación de OpenAPI)
        run: pnpm test:e2e
      - id: env
        uses: ./.github/actions/ci-env
      - name: PostgreSQL efímero
        env:
          DB_PASSWORD: ${{ steps.env.outputs.db-password }}
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD="$DB_PASSWORD" -e POSTGRES_DB=api-drinks-ci \
            postgres:18-alpine
          for _ in $(seq 1 30); do
            # TCP check: the temporary init server only listens on the Unix socket.
            docker exec postgres pg_isready -h 127.0.0.1 -U postgres -d api-drinks-ci && exit 0
            sleep 1
          done
          docker logs postgres
          exit 1
      - name: Migraciones
        run: pnpm db:migrate
      - name: Pruebas de integración (Postgres)
        run: pnpm test:int

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: api-drinks:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: ./.github/actions/ci-env
      - name: Prueba de humo (la imagen arranca y /health responde)
        run: |
          docker run -d --name api --network host --env-file .env api-drinks:ci
          port="$(grep '^PORT=' .env | cut -d= -f2)"
          for _ in $(seq 1 30); do
            curl -sf "http://localhost:${port}/health" && exit 0
            sleep 1
          done
          docker logs api
          exit 1
      # Only on main: the tested image travels to the publish job, which runs once every check passed.
      - name: Guardar la imagen probada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save api-drinks:ci | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  publish:
    name: Publicar y desplegar
    # Push to main only (release merges), and only after the three required checks passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, tests, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/api-drinks
    steps:
      - name: Obtener short SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: Cargar la imagen probada (no se reconstruye)
        run: gunzip -c image.tar.gz | docker load

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push a Docker Hub (latest y <sha>)
        run: |
          for tag in latest "${{ steps.vars.outputs.SHORT_SHA }}"; do
            docker tag api-drinks:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done

      - name: Desplegar en Render ese commit exacto
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          # The <sha> tag, not latest: Render runs exactly what this workflow tested.
          body=$(jq -n --arg img "$IMAGE:${{ steps.vars.outputs.SHORT_SHA }}" '{imageUrl: $img}')
          deploy=$(curl -fsS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'accept: application/json' -H 'content-type: application/json' -d "$body")
          echo "id=$(jq -r .id <<<"$deploy")" >> "$GITHUB_OUTPUT"
          echo "Render: despliegue $(jq -r .id <<<"$deploy") solicitado"

      - name: Esperar a que Render lo deje en vivo
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          for _ in $(seq 1 60); do
            status=$(curl -fsS "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/${{ steps.deploy.outputs.id }}" \
              -H "Authorization: Bearer $RENDER_API_KEY" -H 'accept: application/json' | jq -r .status)
            echo "Render: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed)
                echo "::error::El despliegue en Render terminó en $status"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Render no terminó en 15 minutos"; exit 1

      - name: Resumen
        run: |
          {
            echo "### Despliegue en producción"
            echo "- Imagen: \`$IMAGE:latest\` y \`$IMAGE:${{ steps.vars.outputs.SHORT_SHA }}\`"
            echo "- Render: despliegue \`${{ steps.deploy.outputs.id }}\` en vivo"
          } >> "$GITHUB_STEP_SUMMARY"
