name: CI/CD

# CI on every PR to main/develop (the rulesets require these three checks).
# CD on push to main/develop: publish the Docker image to GitHub Container Registry.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    # The job name is the status check the rulesets require: keep them in sync.
    name: Formato, análisis, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Formato (prettier)
        run: pnpm format:check
      - name: Análisis de tipos (tsc)
        run: pnpm typecheck
      - name: Pruebas unitarias
        run: pnpm test
      - name: Build
        run: pnpm build

  tests:
    name: lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Lint (oxlint)
        run: pnpm lint
      - name: Pruebas e2e (fakes en memoria, incluye verificación de OpenAPI)
        run: pnpm test:e2e
      - id: env
        uses: ./.github/actions/ci-env
      - name: PostgreSQL efímero
        env:
          DB_PASSWORD: ${{ steps.env.outputs.db-password }}
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD="$DB_PASSWORD" -e POSTGRES_DB=api-drinks-ci \
            postgres:18-alpine
          for i in $(seq 1 30); do
            # TCP check: the temporary init server only listens on the Unix socket.
            docker exec postgres pg_isready -h 127.0.0.1 -U postgres -d api-drinks-ci && exit 0
            sleep 1
          done
          docker logs postgres
          exit 1
      - name: Migraciones
        run: pnpm db:migrate
      - name: Pruebas de integración (Postgres)
        run: pnpm test:int

  docker:
    name: build dela imagen en docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: api-drinks:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: ./.github/actions/ci-env
      - name: Prueba de humo (la imagen arranca y /health responde)
        run: |
          docker run -d --name api --network host --env-file .env api-drinks:ci
          port="$(grep '^PORT=' .env | cut -d= -f2)"
          for i in $(seq 1 30); do
            curl -sf "http://localhost:${port}/health" && exit 0
            sleep 1
          done
          docker logs api
          exit 1
      - name: Login en GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar imagen (CD)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
