name: CI/CD

# CI on every PR to main/develop. The rulesets require the three job names below as status checks.
# CD, once every check passed, with the very image CI tested (never rebuilt):
#   push to develop → Docker Hub `develop` + `<sha>`, and Render (staging) deploys that `<sha>`.
#   push to main    → Docker Hub `latest` + `<sha>` (production; where it runs is still to be defined).
# Secrets: DOCKER_USERNAME, DOCKER_TOKEN, RENDER_API_KEY, RENDER_SERVICE_ID (the staging service).
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    # The job name is the status check the rulesets require: keep them in sync.
    name: Calidad y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Formato (prettier)
        run: pnpm format:check
      - name: Análisis de tipos (tsc)
        run: pnpm typecheck
      - name: Lint (oxlint)
        run: pnpm lint
      - name: Pruebas unitarias
        run: pnpm test
      - name: Build
        run: pnpm build
      - uses: ./.github/actions/ci-env
      - name: Contrato OpenAPI y cliente tipado al día
        # Regenerates openapi/openapi.json and openapi/api.d.ts: if they differ from the
        # committed ones, the API contract changed without regenerating them.
        run: pnpm openapi:check

  tests:
    name: Pruebas e2e e integración
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Pruebas e2e (fakes en memoria, incluye verificación de OpenAPI)
        run: pnpm test:e2e
      - id: env
        uses: ./.github/actions/ci-env
      - name: PostgreSQL efímero
        env:
          DB_PASSWORD: ${{ steps.env.outputs.db-password }}
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD="$DB_PASSWORD" -e POSTGRES_DB=api-drinks-ci \
            postgres:18-alpine
          for _ in $(seq 1 30); do
            # TCP check: the temporary init server only listens on the Unix socket.
            docker exec postgres pg_isready -h 127.0.0.1 -U postgres -d api-drinks-ci && exit 0
            sleep 1
          done
          docker logs postgres
          exit 1
      - name: Migraciones
        run: pnpm db:migrate
      - name: Pruebas de integración (Postgres)
        run: pnpm test:int

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: api-drinks:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: ./.github/actions/ci-env
      - name: Prueba de humo (la imagen arranca y /health responde)
        run: |
          docker run -d --name api --network host --env-file .env api-drinks:ci
          port="$(grep '^PORT=' .env | cut -d= -f2)"
          for _ in $(seq 1 30); do
            curl -sf "http://localhost:${port}/health" && exit 0
            sleep 1
          done
          docker logs api
          exit 1
      # On main and develop: the tested image travels to the publish job, which runs once every check passed.
      - name: Guardar la imagen probada
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: docker save api-drinks:ci | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  publish:
    name: Publicar imagen
    # Push to main or develop, and only after the three required checks passed.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [quality, tests, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/api-drinks
      # latest = production (main); develop = what staging runs.
      CHANNEL: ${{ github.ref == 'refs/heads/main' && 'latest' || 'develop' }}
    outputs:
      sha: ${{ steps.vars.outputs.SHORT_SHA }}
    steps:
      - name: Obtener short SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: Cargar la imagen probada (no se reconstruye)
        run: gunzip -c image.tar.gz | docker load

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push a Docker Hub (canal y <sha>)
        run: |
          for tag in "$CHANNEL" "${{ steps.vars.outputs.SHORT_SHA }}"; do
            docker tag api-drinks:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          echo "- Imagen: \`$IMAGE:$CHANNEL\` y \`$IMAGE:${{ steps.vars.outputs.SHORT_SHA }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Desplegar en staging (Render)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/api-drinks:${{ needs.publish.outputs.sha }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Pedir a Render que despliegue ese <sha>
        id: deploy
        run: |
          # The <sha>, not the moving `develop` tag: Render runs exactly this commit's image.
          body=$(jq -n --arg img "$IMAGE" '{imageUrl: $img}')
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'accept: application/json' -H 'content-type: application/json' -d "$body")
          code=$(tail -n1 <<<"$response")
          payload=$(sed '$d' <<<"$response")
          if [[ "$code" != 2* ]]; then
            # Render explains itself in the body (e.g. imageUrl on a service built from a repo).
            echo "::error::Render respondió $code: $(jq -r '.message // .' <<<"$payload" 2>/dev/null || echo "$payload")"
            exit 1
          fi
          echo "id=$(jq -r .id <<<"$payload")" >> "$GITHUB_OUTPUT"
          echo "Render: despliegue $(jq -r .id <<<"$payload") de $IMAGE solicitado"

      - name: Esperar a que Render lo deje en vivo
        run: |
          for _ in $(seq 1 60); do
            response=$(curl -sS -w '\n%{http_code}' \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/${{ steps.deploy.outputs.id }}" \
              -H "Authorization: Bearer $RENDER_API_KEY" -H 'accept: application/json')
            code=$(tail -n1 <<<"$response")
            payload=$(sed '$d' <<<"$response")
            if [[ "$code" != 2* ]]; then
              echo "::error::Render respondió $code: $(jq -r '.message // .' <<<"$payload" 2>/dev/null || echo "$payload")"
              exit 1
            fi
            status=$(jq -r .status <<<"$payload")
            echo "Render: $status"
            case "$status" in
              live)
                echo "- Staging: \`$IMAGE\` en vivo en Render" >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed)
                echo "::error::El despliegue en Render terminó en $status. Revisa los logs del servicio en Render"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Render no terminó en 15 minutos"; exit 1
