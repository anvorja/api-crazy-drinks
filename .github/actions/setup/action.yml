name: Preparar Node y dependencias
description: Instala pnpm (versión de "packageManager"), Node 24 con caché y las dependencias exactas del lockfile.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
