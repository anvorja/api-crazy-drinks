# Full stack for local use or a single server: API + PostgreSQL (+ Mailpit to see emails).
# Reads .env (cp .env.example .env). Nothing secret is written here.
#   docker compose up -d --build
#   docker compose --profile mail up -d      # also Mailpit on http://localhost:8025
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network the database is the "postgres" service.
      DB_HOST: postgres
      # Same PORT as the published one below (a shell PORT overrides .env for both).
      PORT: ${PORT}
      DB_PORT: '5432'
      MIGRATE_ON_START: 'true'
    ports:
      - '${PORT:?set PORT in .env}:${PORT}'
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit
    profiles: [mail]
    ports:
      - '8025:8025'
      - '1025:1025'

volumes:
  postgres-data:
